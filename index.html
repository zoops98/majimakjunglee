<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지문 최종정리 분석</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1e8;
    --surface: #ffffff;
    --surface-soft: #fdfcf8;
    --text: #1f1f1f;
    --text-soft: #6b6b6b;
    --border: #e8e7e1;
    --primary: #5a7d5a;
    --primary-hover: #455e45;
    --danger: #b3261e;
    --danger-bg: #fdecec;
    /* Option C accents — used only outside result cards */
    --c-header-bg: #fdfbf3;
    --c-header-border: #e3ddc8;
    --c-input-bg: #fcfaf2;
    --c-input-border: #d6cfb4;
    --c-accent-warm: #b56a3e;
    --c-serif: 'Noto Serif KR', serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* Header — Option C: warm cream + sage + serif */
  header.app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 28px;
    background: var(--c-header-bg);
    border-bottom: 1px solid var(--c-header-border);
    position: sticky; top: 0; z-index: 10;
  }
  .brand-mark {
    display: flex; align-items: center; gap: 14px;
  }
  .brand-logo {
    width: 46px; height: 46px;
    flex-shrink: 0;
    border-radius: 8px;
    object-fit: cover;
    background: #fff;
  }
  .brand-titles { line-height: 1.2; }
  .brand-title {
    margin: 0;
    font-family: var(--c-serif);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.018em;
    color: var(--text);
  }
  .brand-tagline {
    margin-top: 3px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: #5a7d5a;
  }
  .header-actions {
    display: flex; align-items: center; gap: 16px;
  }
  .copyright {
    font-size: 11px;
    color: #8b8b80;
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .settings-btn {
    background: transparent;
    border: 1px solid #cdc6ad;
    padding: 6px 14px;
    border-radius: 20px;
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
    color: #5a5a52;
    display: inline-flex; align-items: center; gap: 5px;
    transition: all 0.15s;
  }
  .settings-btn:hover {
    background: #fff;
    border-color: var(--primary);
    color: var(--primary);
  }

  main {
    max-width: 920px;
    margin: 24px auto 60px;
    padding: 0 24px;
  }

  /* Input section */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 26px;
    margin-bottom: 24px;
  }
  .field { margin-bottom: 16px; }
  .field-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .field-row .field { margin-bottom: 0; }
  .field-row .field-grow { flex: 2.2; min-width: 0; }
  .field-row .field-fixed { flex: 1; min-width: 0; }
  @media (max-width: 560px) {
    .field-row { flex-direction: column; gap: 14px; }
  }
  .field label {
    display: block;
    font-size: 13px; font-weight: 600;
    margin-bottom: 7px;
    color: var(--text-soft);
    letter-spacing: -0.005em;
  }
  .field input[type="text"], .field textarea, .field input[type="password"] {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface-soft);
    border-radius: 7px;
    padding: 11px 13px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    resize: vertical;
    transition: border-color 0.15s, background 0.15s;
  }
  .field textarea { min-height: 220px; line-height: 1.6; }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
  }
  .field textarea::placeholder, .field input::placeholder {
    color: #b5b3a8;
  }

  .actions {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 6px;
  }
  .btn {
    padding: 11px 22px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--c-input-border);
    background: var(--c-header-bg);
    color: var(--text);
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.15s;
    letter-spacing: 0.01em;
  }
  .btn:hover:not(:disabled) {
    background: var(--c-input-bg);
    border-color: var(--primary);
    color: var(--primary);
  }
  .btn.primary {
    background: var(--primary);
    color: var(--c-header-bg);
    border-color: var(--primary);
  }
  .btn.primary:hover:not(:disabled) {
    background: var(--primary-hover);
    color: var(--c-header-bg);
    border-color: var(--primary-hover);
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Loading */
  .loading {
    display: none;
    flex-direction: column; align-items: center; gap: 14px;
    padding: 42px;
    background: var(--c-header-bg);
    border: 1px solid var(--c-header-border);
    border-radius: 4px;
    margin-bottom: 24px;
  }
  .loading.show { display: flex; }
  .spinner {
    width: 38px; height: 38px;
    border: 3px solid #ebeae3;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading p {
    margin: 0;
    color: var(--text-soft);
    font-size: 13px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error {
    display: none;
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    padding: 13px 17px;
    margin-bottom: 24px;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .error.show { display: block; }

  /* Result header */
  .result-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .result-meta h2 {
    margin: 0;
    font-size: 16px; font-weight: 700;
    letter-spacing: -0.015em;
  }
  .result-meta .stamp {
    font-size: 11px; color: var(--text-soft);
  }

  /* Cards */
  .results {
    display: none;
    flex-direction: column; gap: 14px;
  }
  .results.show { display: flex; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    border-left: 4px solid var(--border);
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .card-head {
    display: flex; align-items: center; gap: 9px;
    margin-bottom: 11px;
  }
  .card-icon {
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px;
    font-size: 14px;
    flex-shrink: 0;
  }
  .card-title {
    margin: 0;
    font-size: 14.5px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .card-title .en {
    color: var(--text-soft);
    font-weight: 500;
    font-size: 12.5px;
    margin-left: 4px;
  }
  .card-num {
    margin-left: auto;
    font-size: 10.5px; font-weight: 600;
    color: var(--text-soft);
    background: #f3f2ec;
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.04em;
  }
  .card-body {
    font-size: 13.8px;
    color: var(--text);
  }
  .card-body p { margin: 5px 0; }
  .label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-soft);
    letter-spacing: 0.03em;
    margin-right: 5px;
    text-transform: uppercase;
  }
  .label-ko {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-soft);
    margin-right: 5px;
    text-transform: none;
    letter-spacing: 0;
  }

  /* Per-card accents */
  .card.c-topic      { border-left-color: #7fbf9c; background: linear-gradient(to right, #f0f8f3 0%, #f0f8f3 4px, var(--surface) 4px); }
  .card.c-summary    { border-left-color: #e9a484; background: linear-gradient(to right, #fcf2eb 0%, #fcf2eb 4px, var(--surface) 4px); }
  .card.c-structure  { border-left-color: #d6b85a; background: linear-gradient(to right, #fbf6e3 0%, #fbf6e3 4px, var(--surface) 4px); }
  .card.c-objective  { border-left-color: #6f9cc6; background: linear-gradient(to right, #eaf2f9 0%, #eaf2f9 4px, var(--surface) 4px); }
  .card.c-short      { border-left-color: #9c87c8; background: linear-gradient(to right, #f1ecf8 0%, #f1ecf8 4px, var(--surface) 4px); }
  .card.c-keywords   { border-left-color: #cf7e9a; background: linear-gradient(to right, #fbecf1 0%, #fbecf1 4px, var(--surface) 4px); }
  .card.c-completion { border-left-color: #94a978; background: linear-gradient(to right, #f1f4e9 0%, #f1f4e9 4px, var(--surface) 4px); }
  .card.c-tf         { border-left-color: #db8470; background: linear-gradient(to right, #fbeae4 0%, #fbeae4 4px, var(--surface) 4px); }
  .card.c-analysis   { border-left-color: #6e8a8c; background: linear-gradient(to right, #e9f1f1 0%, #e9f1f1 4px, var(--surface) 4px); }
  .card.c-correction { border-left-color: #c89860; background: linear-gradient(to right, #faf2e2 0%, #faf2e2 4px, var(--surface) 4px); }

  /* Text corrections */
  .corr-block {
    padding: 11px 0;
    border-bottom: 1px dashed #e8e0c8;
  }
  .corr-block:first-child { padding-top: 4px; }
  .corr-block:last-child { border-bottom: none; padding-bottom: 4px; }
  .corr-issue {
    font-size: 11.5px;
    color: #8a6a30;
    font-weight: 700;
    margin-bottom: 8px;
    padding: 2px 9px;
    background: #fbecd0;
    border-radius: 4px;
    display: inline-block;
    letter-spacing: 0.02em;
  }
  .corr-row {
    display: flex;
    gap: 9px;
    padding: 3px 0;
    font-size: 13px;
    line-height: 1.55;
    align-items: flex-start;
  }
  .corr-label {
    flex-shrink: 0;
    width: 34px;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-soft);
    background: #f3f3ec;
    padding: 2px 0;
    border-radius: 3px;
    text-align: center;
    margin-top: 2px;
    letter-spacing: 0.05em;
  }
  .corr-orig {
    color: #a83e2c;
    text-decoration: line-through;
    text-decoration-color: #d9a895;
    flex: 1;
  }
  .corr-fixed {
    color: #2e7d4f;
    font-weight: 500;
    flex: 1;
  }

  /* Sentence analysis */
  .sent-block {
    padding: 12px 0;
    border-bottom: 1px dashed #e0e0d3;
  }
  .sent-block:first-child { padding-top: 4px; }
  .sent-block:last-child { border-bottom: none; padding-bottom: 4px; }

  .sent-title {
    font-size: 12.5px;
    font-weight: 700;
    color: #3a5557;
    margin-bottom: 7px;
    padding-left: 9px;
    border-left: 3px solid #6e8a8c;
    line-height: 1.4;
  }
  .sent-en {
    font-size: 13.2px;
    line-height: 1.55;
    padding: 9px 13px;
    background: #f1f6f6;
    border-radius: 6px;
    margin: 6px 0;
    color: #2a3d3f;
    font-style: italic;
  }
  .sent-ko {
    font-size: 13px;
    color: var(--text);
    margin: 6px 0 8px;
    line-height: 1.55;
  }
  .sent-ko .label-ko { color: #6e8a8c; font-weight: 700; }

  .sent-section { margin: 8px 0 4px; }
  .sent-section-label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-soft);
    letter-spacing: 0.06em;
    margin-bottom: 5px;
    text-transform: uppercase;
  }
  .sent-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
    gap: 10px;
    padding: 3px 0;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .sent-row .en { color: #2a3d3f; font-weight: 500; }
  .sent-row .ko { color: var(--text-soft); }

  .sent-grammar {
    font-size: 12.3px;
    background: var(--surface-soft);
    padding: 8px 11px;
    border-radius: 5px;
    color: var(--text);
    line-height: 1.55;
    border-left: 2px solid #c4d1d1;
  }

  /* Keyword list */
  .keyword-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }
  /* If total count is odd, last item spans both columns to keep the grid tidy */
  .keyword-item:last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }
  .keyword-item {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 13px;
  }
  .keyword-item .row1 { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .keyword-item .word { font-weight: 700; font-size: 14px; }
  .keyword-item .meaning { color: var(--text-soft); font-size: 13px; }
  .keyword-item .row2 {
    font-size: 11.5px;
    color: var(--text-soft);
    margin-top: 4px;
    line-height: 1.55;
  }

  /* Structure / Objective / Short / Completion / TF detailed */
  .struct-item {
    display: flex; gap: 12px;
    padding: 6px 0;
    border-bottom: 1px dashed #ededdf;
    align-items: baseline;
  }
  .struct-item:last-child { border-bottom: none; }
  .struct-item .part {
    flex-shrink: 0;
    min-width: 56px;
    padding: 3px 10px;
    white-space: nowrap;
    font-size: 11.5px;
    font-weight: 700;
    color: #8a651e;
    background: #faf3e0;
    border-radius: 4px;
    text-align: center;
    letter-spacing: 0.01em;
  }
  .struct-item .content { flex: 1; font-size: 13.5px; line-height: 1.55; }

  /* Topic card body */
  .topic-en {
    margin: 4px 0;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.55;
  }
  .topic-ko {
    margin: 4px 0;
    font-size: 13.5px;
    color: var(--text-soft);
    line-height: 1.55;
  }

  .obj-item {
    padding: 8px 0;
    border-bottom: 1px dashed #ededdf;
  }
  .obj-item:last-child { border-bottom: none; }
  .obj-item .head {
    display: flex; gap: 7px;
    align-items: baseline;
    font-weight: 600;
    font-size: 13.5px;
  }
  .obj-item .head .badge {
    font-size: 10.5px; font-weight: 700;
    background: #dbe6f1;
    color: #305a85;
    padding: 1px 6px; border-radius: 3px;
  }
  .obj-item .point {
    color: var(--text-soft);
    margin: 4px 0 0 14px;
    font-size: 13px;
    line-height: 1.5;
  }
  .obj-item .point::before { content: "↳ "; color: #aaa; }

  .qa-block { display: flex; flex-direction: column; gap: 2px; }
  .qa-row {
    display: flex; gap: 9px;
    padding: 4px 0;
    align-items: flex-start;
  }
  .qa-mark {
    flex-shrink: 0;
    height: 18px;
    min-width: 18px;
    border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700;
    margin-top: 3px;
    padding: 0 6px;
    letter-spacing: 0.02em;
  }
  .qa-q  { background: #9c87c8; color: #fff; }
  .qa-a  { background: #f0ecf7; color: #6c5598; }
  .qa-en { background: #d8e6cc; color: #4f6b3e; font-size: 9.5px; }
  .qa-text { flex: 1; font-size: 13.8px; line-height: 1.6; }
  .qa-text-en { font-style: italic; color: #3a4a32; }

  .completion-text {
    font-size: 13.8px;
    line-height: 1.7;
    padding: 10px 12px;
    background: var(--surface-soft);
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .completion-text .blank {
    display: inline-block;
    min-width: 36px;
    text-align: center;
    font-weight: 700;
    color: #5f7350;
    border-bottom: 1.5px solid #5f7350;
    padding: 0 6px;
  }
  .completion-ans {
    font-size: 12.5px; color: var(--text-soft);
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  .completion-ans strong { color: #5f7350; font-weight: 700; margin-right: 4px; }
  .completion-ko {
    margin-top: 10px;
    padding: 9px 13px;
    font-size: 12.8px;
    color: #4a5340;
    background: #f5f8ec;
    border-radius: 6px;
    border-left: 2.5px solid #94a978;
    line-height: 1.6;
  }
  .completion-ko::before {
    content: "해석";
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    color: #6b7a4a;
    margin-bottom: 3px;
    letter-spacing: 0.04em;
  }

  /* Keyword copy button */
  .kw-actions {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .copy-btn {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 6px;
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
    color: var(--text-soft);
    transition: all 0.15s;
  }
  .copy-btn:hover { background: #f0eee5; color: var(--text); }
  .copy-btn.copied { background: #dff0e5; color: #2f7d52; border-color: #b8dcc6; }

  .tf-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 7px 0;
    border-bottom: 1px dashed #ededdf;
  }
  .tf-item:last-child { border-bottom: none; }
  .tf-item .n {
    flex-shrink: 0;
    font-weight: 700; font-size: 12.5px; color: var(--text-soft);
    width: 16px; padding-top: 2px;
  }
  .tf-item .stmt { flex: 1; font-size: 13.5px; line-height: 1.5; }
  .tf-item .ans {
    flex-shrink: 0;
    font-weight: 800; font-size: 13px;
    padding: 1px 9px; border-radius: 4px;
    margin-top: 1px;
  }
  .tf-item .ans.T { background: #dff0e5; color: #2f7d52; }
  .tf-item .ans.F { background: #fbe2dc; color: #b14535; }

  /* Modal */
  .modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(28, 28, 28, 0.5);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: var(--c-header-bg);
    border-radius: 4px;
    padding: 28px 30px;
    width: 100%; max-width: 460px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    border: 1px solid var(--c-header-border);
  }
  .modal-content h2 {
    font-family: var(--c-serif);
    font-size: 18px; font-weight: 700;
    margin: 0 0 4px 0;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .modal-content > .desc {
    color: var(--text-soft);
    font-size: 12.5px;
    margin: 0 0 18px;
  }
  .modal-content label {
    display: block;
    font-family: var(--c-serif);
    font-size: 12.5px; font-weight: 700;
    margin: 14px 0 5px;
    color: var(--text);
  }
  .modal-content input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--c-input-border);
    border-radius: 3px;
    font-family: inherit;
    font-size: 14px;
    background: var(--c-input-bg);
  }
  .modal-content input:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
  }
  .modal-content .hint {
    font-size: 11.5px;
    color: var(--text-soft);
    margin: 14px 0 18px;
    line-height: 1.55;
    padding: 10px 12px;
    background: #f5efd9;
    border-radius: 3px;
    border-left: 2px solid #c89c4b;
  }
  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end;
  }

  /* Print watermark — repeats on every page in Chrome */
  .print-footer {
    display: none;
  }

  /* PRINT */
  @media print {
    @page {
      size: A4;
      margin: 11mm 10mm 10mm 10mm;
    }
    html, body {
      background: #fff !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .no-print, .app-header { display: none !important; }
    main { margin: 0; padding: 0; max-width: 100%; }
    .results { gap: 7px; }
    .result-meta { margin-bottom: 9px; padding-bottom: 7px; }
    .result-meta h2 { font-size: 13.5px; }
    .result-meta .stamp { font-size: 10px; }
    /* Force pure white card backgrounds — strip gradient tints */
    .card {
      padding: 10px 13px;
      page-break-inside: avoid;
      break-inside: avoid;
      box-shadow: none;
      background: #fff !important;
    }
    .card-head { margin-bottom: 7px; }
    .card-title { font-size: 12.5px; }
    .card-title .en { font-size: 11px; }
    .card-body { font-size: 11.5px; line-height: 1.5; }
    .card-body p { margin: 3px 0; }
    .keyword-list { gap: 5px; }
    .keyword-item { padding: 6px 9px; }
    .keyword-item .word { font-size: 12px; }
    .keyword-item .meaning, .keyword-item .row2 { font-size: 10.5px; }
    .struct-item .content, .obj-item .head { font-size: 11.5px; }
    .struct-item .part { font-size: 10.5px; min-width: 50px; padding: 2px 8px; }
    .topic-en { font-size: 11.5px; margin: 2px 0; }
    .topic-ko { font-size: 11px; margin: 2px 0; }
    .qa-text { font-size: 11.5px; line-height: 1.5; }
    .qa-text-en { font-size: 11px; }
    .qa-mark { font-size: 9.5px; height: 14px; min-width: 14px; margin-top: 2px; padding: 0 5px; }
    .qa-en { font-size: 8.5px !important; }
    .obj-item .point { font-size: 11px; margin-top: 2px; }
    .tf-item .stmt { font-size: 11.5px; }
    .tf-item .ans { font-size: 11px; padding: 0 7px; }
    .completion-text { font-size: 11.5px; padding: 7px 10px; line-height: 1.55; }
    .completion-ans { font-size: 11px; }
    .completion-ko { font-size: 10.5px; padding: 6px 9px; margin-top: 6px; }
    .completion-ko::before { font-size: 9px; }
    .kw-actions { display: none !important; }
    .sent-block { padding: 7px 0; }
    .sent-title { font-size: 10.5px; margin-bottom: 4px; padding-left: 7px; }
    .sent-en { font-size: 11px; padding: 5px 9px; margin: 3px 0; }
    .sent-ko { font-size: 11px; margin: 3px 0 5px; }
    .sent-section { margin: 5px 0 2px; }
    .sent-section-label { font-size: 9px; margin-bottom: 2px; }
    .sent-row { font-size: 10.5px; padding: 1px 0; gap: 7px; }
    .sent-grammar { font-size: 10.5px; padding: 5px 8px; }
    .corr-block { padding: 6px 0; }
    .corr-issue { font-size: 9.5px; margin-bottom: 4px; padding: 1px 7px; }
    .corr-row { font-size: 10.5px; padding: 1px 0; gap: 7px; }
    .corr-label { font-size: 9px; width: 28px; padding: 1px 0; }
    /* Force white backgrounds on accented sub-elements for cleaner print */
    .keyword-item, .completion-text, .sent-en, .sent-grammar,
    .corr-issue {
      background: #fff !important;
    }
    .completion-ko { background: #f7faef !important; }
    /* Watermark footer removed — branding only in the result-meta header */
    .print-footer { display: none !important; }
  }
</style>

- 주어진 영어 지문의 주제, 이해하기 쉬운 재미있는 요약, 구조 정리, 변형 가능성 높은 유형 파악, 핵심 단어 정리, 주요 문장 분석을 수행한다

# 규칙
- 주제는 반드시 영문 → 한글 순
- 쉬운 요약은 학생 친화적, 쉬운 단어, 약간 재미있는 톤 (적절한 비유/메타포 환영)
- 구조는 지문 성격에 따라 2~5단계 유연하게 (도입-내용정리, 도입-전개-결론, 도입-원리-예시-한계-결론 등)
- **객관식 변형(objectiveVariations)은 정확히 2가지이며 원문 출제 유형과는 달라야 함. variationPoint은 풍부하게 작성: (1) 어디가 어떻게 변형되는지, (2) 학생이 어떤 이해/지식을 갖춰야 하는지, (3) 가능하면 변형된 영어 문장 예시나 가능한 정답/오답 키워드까지 포함하여 구체적으로 작성. 줄바꿈(\\n)을 사용해 가독성 확보**
- **핵심 단어는 3~7개. 지문의 길이와 어휘 난이도에 따라 자연스럽게 선별 (짧고 쉬운 지문은 3~4개, 길고 어려운 지문은 6~7개). 학습 가치가 낮은 단어를 억지로 채우지 말 것 — 진짜 시험에 자주 출제되거나 의미 파악에 핵심이 되는 단어만**. pasteFormat은 반드시 "영어(한글뜻) 동의어: xxx 반의어: yyy" 한 줄 형식 (동의어/반의어가 없으면 '-' 표기)
- 서술형은 반드시 지문의 핵심 내용을 묻는 문항. **answer는 한글로, answerEn은 영어로 모두 작성. answerEn은 반드시 지문에 등장하는 단어/표현/구문(content words, key verbs, collocations)을 최대한 그대로 활용하여 자연스러운 문장으로 작성할 것 — 새로운 어휘 도입 최소화**
- 요약문 완성의 영어 본문은 반드시 본문 단어 대신 문맥에 맞는 유의어를 사용
- T/F는 정확히 3문항
- **주요 문장 분석(sentenceAnalysis)은 반드시 정확히 5개의 객체. 4개도 6개도 절대 안 됨. 지문이 짧더라도 학습 가치 있는 문장 5개를 반드시 선별할 것.** 영어 원문(sentence 필드)은 지문에 등장한 그대로 사용 (임의 변형/요약 금지). structure는 의미 단위로 청크를 나눠 영문-한글 매칭. expressions와 grammar는 해당 문장에서 학습 가치가 있을 때만 작성하며, 없을 때 expressions는 빈 배열 [], grammar는 빈 문자열 ""로 표기
- **textCorrections는 지문에 명백한 문법/어법/철자/관사/전치사 오류 등이 있을 때만 작성 (단순한 스타일 차이나 영국식/미국식 차이는 제외). 오류가 없으면 빈 배열 []로 표기**
- JSON 내 큰따옴표(")는 반드시 이스케이프 처리
- 한국 고등학교 내신/수능 출제 관점에서 변별력 있게`;

  // ---------- API CALL ----------
  async function callGemini(passage) {
    const apiKey = localStorage.getItem('zoops_apiKey');
    const model = localStorage.getItem('zoops_model') || 'gemini-2.5-flash';
    if (!apiKey) {
      throw new Error('Gemini API 키가 설정되지 않았습니다. 우측 상단 [설정]에서 키를 입력해주세요.');
    }

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    const body = {
      contents: [{
        role: 'user',
        parts: [{ text: SYSTEM_PROMPT + '\n\n--- 분석할 지문 ---\n' + passage }]
      }],
      generationConfig: {
        responseMimeType: 'application/json',
        temperature: 0.5
      }
    };

    const maxRetries = 3;
    let lastErr;
    for (let i = 0; i < maxRetries; i++) {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey.trim() },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          const errText = await res.text();
          const msg = `API 오류 ${res.status}: ${errText.slice(0, 240)}`;
          if (res.status >= 500 || res.status === 429) {
            lastErr = new Error(msg);
            await new Promise(r => setTimeout(r, 1200 * (i + 1)));
            continue;
          }
          if (res.status === 404) {
            throw new Error(`모델 '${model}' 을(를) 찾을 수 없습니다. 설정에서 'gemini-2.5-flash' 또는 'gemini-2.5-pro' 로 변경해주세요.`);
          }
          throw new Error(msg);
        }
        const data = await res.json();
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error('API에서 빈 응답이 반환되었습니다. 잠시 후 다시 시도해주세요.');
        try {
          return JSON.parse(text);
        } catch (parseErr) {
          // Try to recover JSON if wrapped
          const match = text.match(/\{[\s\S]*\}/);
          if (match) return JSON.parse(match[0]);
          throw new Error('AI 응답을 JSON으로 파싱하지 못했습니다.');
        }
      } catch (e) {
        lastErr = e;
        if (i === maxRetries - 1) throw e;
        await new Promise(r => setTimeout(r, 1000 * (i + 1)));
      }
    }
    throw lastErr;
  }

  // ---------- RENDERING ----------
  function esc(s) {
    return String(s ?? '').replace(/[<>&"']/g, c => ({
      '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function cardWrap(cls, icon, titleKo, titleEn, num, bodyHTML) {
    return `
      <article class="card c-${cls}">
        <div class="card-head">
          <h3 class="card-title">${titleKo}<span class="en">${titleEn}</span></h3>
          <span class="card-num">${String(num).padStart(2, '0')}</span>
        </div>
        <div class="card-body">${bodyHTML}</div>
      </article>
    `;
  }

  function renderCompletionText(text) {
    // Replace (A) and (B) with styled blanks
    return esc(text)
      .replace(/\(A\)/g, '<span class="blank">(A)</span>')
      .replace(/\(B\)/g, '<span class="blank">(B)</span>');
  }

  function renderResults(data, source, academy) {
    const cards = [];

    cards.push(cardWrap('topic', '', '주제', 'Topic', 1, `

      <p class="topic-ko">${esc(data.topic?.korean || '')}</p>
    `));

    cards.push(cardWrap('summary', '', '쉬운 요약', 'Summary', 2, `
      <p>${esc(data.summary || '')}</p>
    `));

    cards.push(cardWrap('structure', '', '글의 구조', 'Structure', 3,
      (data.structure || []).map(s => `
        <div class="struct-item">
          <div class="part">${esc(s.part || '')}</div>
          <div class="content">${esc(s.content || '')}</div>
        </div>
      `).join('')
    ));

    cards.push(cardWrap('short', '', '서술형 문제', 'Short Answer', 4, `
      <div class="qa-block">
        <div class="qa-row">
          <span class="qa-mark qa-q">Q</span>
          <span class="qa-text">${esc(data.shortAnswer?.question || '')}</span>
        </div>
        <div class="qa-row">
          <span class="qa-mark qa-a">A</span>
          <span class="qa-text">${esc(data.shortAnswer?.answer || '')}</span>
        </div>
        ${data.shortAnswer?.answerEn ? `
        <div class="qa-row">
          <span class="qa-mark qa-en">EN</span>
          <span class="qa-text qa-text-en">${esc(data.shortAnswer.answerEn)}</span>
        </div>` : ''}
      </div>
    `));

    cards.push(cardWrap('tf', '', 'T/F 확인 문제', 'True or False', 5,
      (data.trueFalse || []).map((t, i) => `
        <div class="tf-item">
          <span class="n">${i + 1}.</span>
          <span class="stmt">${esc(t.statement || '')}</span>
          <span class="ans ${t.answer === 'T' ? 'T' : 'F'}">${esc(t.answer || '')}</span>
        </div>
      `).join('')
    ));

    cards.push(cardWrap('keywords', '', '핵심 단어', 'Key Words', 6, `
      <div class="kw-actions no-print">
        <button class="copy-btn" id="copyKeywordsBtn">단어 복사</button>
      </div>
      <div class="keyword-list">
        ${(data.keyWords || []).map(k => {
          const syn = (k.synonym || '').trim();
          const ant = (k.antonym || '').trim();
          const hasSyn = syn && syn !== '-';
          const hasAnt = ant && ant !== '-';
          return `
          <div class="keyword-item">
            <div class="row1">
              <span class="word">${esc(k.word || '')}</span>
              <span class="meaning">${esc(k.meaning || '')}</span>
            </div>
            ${(hasSyn || hasAnt) ? `
            <div class="row2">
              ${hasSyn ? `<span class="label-ko">동의어</span>${esc(syn)}` : ''}
              ${hasSyn && hasAnt ? ' · ' : ''}
              ${hasAnt ? `<span class="label-ko">반의어</span>${esc(ant)}` : ''}
            </div>` : ''}
          </div>
        `;
        }).join('')}
      </div>
    `));

    cards.push(cardWrap('completion', '', '요약문 완성', 'Summary Completion', 7, `
      <div class="completion-text">${renderCompletionText(data.summaryCompletion?.text || '')}</div>
      <div class="completion-ans">
        <span><strong>(A) =</strong> ${esc(data.summaryCompletion?.answerA || '')}</span>
        <span><strong>(B) =</strong> ${esc(data.summaryCompletion?.answerB || '')}</span>
      </div>
      ${data.summaryCompletion?.korean ? `<div class="completion-ko">${esc(data.summaryCompletion.korean)}</div>` : ''}
    `));

    cards.push(cardWrap('objective', '', '변형 가능 객관식 유형', 'Multiple Choice', 8,
      (data.objectiveVariations || []).map((o, i) => `
        <div class="obj-item">
          <div class="head">
            <span class="badge">유형 ${i + 1}</span>
            <span>${esc(o.type || '')}</span>
          </div>
          <div class="point">${esc(o.variationPoint || '').replace(/\n/g, '<br>')}</div>

      `).join('')
    ));

    cards.push(cardWrap('analysis', '', '주요 문장 분석', 'Sentence Analysis', 9,
      (data.sentenceAnalysis || []).map((s, i) => {
        const hasStructure = Array.isArray(s.structure) && s.structure.length > 0;
        const hasExpressions = Array.isArray(s.expressions) && s.expressions.length > 0;

        return `

            <div class="sent-en">${esc(s.sentence || '')}</div>

            ${hasExpressions ? `
              <div class="sent-section">
                <span class="sent-section-label">핵심 표현</span>
                ${s.expressions.map(r => `
                  <div class="sent-row">
                    <span class="en">${esc(r.en || '')}</span>
                    <span class="ko">${esc(r.ko || '')}</span>

              </div>` : ''}
            ${hasGrammar ? `
              <div class="sent-section">
                <span class="sent-section-label">핵심 문법</span>
                <div class="sent-grammar">${esc(s.grammar)}</div>
              </div>` : ''}
          </div>
        `;
      }).join('')
    ));

    // Optional: text corrections (only if AI detected errors in the source passage)
    if (Array.isArray(data.textCorrections) && data.textCorrections.length > 0) {
      cards.push(cardWrap('correction', '', '원문 표현 교정', 'Text Corrections', 10,
        data.textCorrections.map(c => `
          <div class="corr-block">
            <div class="corr-issue">${esc(c.issue || '')}</div>
            <div class="corr-row">
              <span class="corr-label">원문</span>
              <span class="corr-orig">${esc(c.original || '')}</span>
            </div>
            <div class="corr-row">
              <span class="corr-label">교정</span>
              <span class="corr-fixed">${esc(c.corrected || '')}</span>
            </div>
          </div>
        `).join('')
      ));
    }

    const displayName = (academy && academy.trim()) ? academy.trim() : 'Zoops Books';
    $('results').innerHTML = `
      <div class="result-meta">
        <h2>${esc(source) || '영어 지문 분석'}</h2>
        <span class="stamp">${esc(displayName)}</span>
      </div>
      ${cards.join('')}
    `;
    $('results').classList.add('show');

    // Bind keyword copy button
    const copyBtn = document.getElementById('copyKeywordsBtn');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const lines = (data.keyWords || []).map(k => {
          if (k.pasteFormat) return k.pasteFormat;
          const syn = k.synonym || '-';
          const ant = k.antonym || '-';
          return `${k.word}(${k.meaning}) 동의어: ${syn} 반의어: ${ant}`;
        });
        const text = lines.join('\n');
        const done = () => {
          copyBtn.textContent = '복사됨';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.textContent = '단어 복사';
            copyBtn.classList.remove('copied');
          }, 1800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        } else {
          fallbackCopy(text, done);
        }
      });
    }
  }

  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    cb && cb();
  }

      '</head>\n<body>\n' +
      '<main>' + resultsHTML + '</main>\n' +
      '</body>\n</html>';

    const blob = new Blob([standalone], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // ---------- ERROR HELPERS ----------
  function showError(msg) {
    const el = $('error');
    el.innerHTML = esc(msg);
    el.classList.add('show');
  }
  function hideError() { $('error').classList.remove('show'); }

  // ---------- EVENTS ----------
  $('settingsBtn').addEventListener('click', () => {
    $('apiKey').value = localStorage.getItem('zoops_apiKey') || '';
    $('modelName').value = localStorage.getItem('zoops_model') || 'gemini-2.5-flash';
    $('settingsModal').classList.add('show');
  });
  $('closeSettings').addEventListener('click', () => $('settingsModal').classList.remove('show'));
  $('saveSettings').addEventListener('click', () => {
    const k = $('apiKey').value.trim();
    const m = ($('modelName').value.trim() || 'gemini-2.5-flash');
    if (k) localStorage.setItem('zoops_apiKey', k);
    localStorage.setItem('zoops_model', m);
    $('settingsModal').classList.remove('show');
  });
  $('settingsModal').addEventListener('click', (e) => {
    if (e.target.id === 'settingsModal') $('settingsModal').classList.remove('show');
  });

  $('analyzeBtn').addEventListener('click', async () => {
    const passage = $('passage').value.trim();
    const source = $('source').value.trim();
    const academy = $('academy').value.trim();
    if (!passage) {
      showError('영어 지문을 입력해주세요.');
      return;
    }
    if (academy) {
      localStorage.setItem('zoops_academy', academy);
    }
    hideError();
    $('results').classList.remove('show');
    $('loading').classList.add('show');
    $('analyzeBtn').disabled = true;
    $('printBtn').disabled = true;
    $('exportBtn').disabled = true;
    try {
      const data = await callGemini(passage);
      lastResult = { data, source, academy };
      renderResults(data, source, academy);
      $('printBtn').disabled = false;
      $('exportBtn').disabled = false;
      // Smooth scroll to results
      setTimeout(() => $('results').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    } catch (e) {
      showError(e.message || String(e));
    } finally {
      $('loading').classList.remove('show');
      $('analyzeBtn').disabled = false;
    }
  });

  $('printBtn').addEventListener('click', () => window.print());
  $('exportBtn').addEventListener('click', exportAsHTML);

  // Initial setup
  if (!localStorage.getItem('zoops_model')) {
    localStorage.setItem('zoops_model', 'gemini-2.5-flash');
  }
  // Restore saved academy name
  const savedAcademy = localStorage.getItem('zoops_academy');
  if (savedAcademy) {
    $('academy').value = savedAcademy;
  }
  // Save academy on input change so it persists even without clicking analyze
  $('academy').addEventListener('input', () => {
    const val = $('academy').value.trim();
    if (val) {
      localStorage.setItem('zoops_academy', val);
    } else {
      localStorage.removeItem('zoops_academy');
    }
  });
</script>

</body>
</html>
